.land #ctrl{-webkit-box-orient:horizontal;-webkit-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.linha{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
.linha+.linha{margin-top:10px}
.land .linha+.linha{margin-top:0;margin-left:10px}
button{-webkit-appearance:none;appearance:none;border:0;margin:0;font:600 14px -apple-system,"Segoe UI",Roboto,sans-serif;color:#fff3e0;background:rgba(13,15,36,.78);border-radius:14px;min-height:46px;padding:0 16px;touch-action:manipulation;cursor:pointer}
button:active{-webkit-transform:scale(.96);transform:scale(.96)}
.seta{width:50px;padding:0;font:18px "Press Start 2P",monospace;line-height:46px}
#nome{font:11px/1.4 "Press Start 2P",monospace;text-transform:uppercase;min-width:150px;text-align:center;padding:9px 10px;margin:0 8px;background:rgba(13,15,36,.78);border-radius:14px;line-height:28px}
.chave{margin:0 5px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
.luz{display:inline-block;width:9px;height:9px;border-radius:50%;background:#5a5c7c;margin-right:9px}
.on .luz{background:#f28c5a;box-shadow:0 0 6px #f28c5a}
#nivel{display:block;height:3px;background:#f28c5a;width:0;margin-top:2px;border-radius:2px}
#inicio{position:absolute;left:0;top:0;width:100%;height:100%;background:#23264a;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;text-align:center;padding:24px;z-index:5}
#inicio h1{font:400 52px/1 "Lilita One",-apple-system,sans-serif;margin:0;letter-spacing:.02em;color:#fff3e0}
#inicio .botao{-webkit-flex-shrink:0;flex-shrink:0;width:84px;height:84px;border-radius:50%;background:#f28c5a;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),0 6px 12px -4px rgba(0,0,0,.6);margin:40px 0 22px}
#inicio .pix{font:11px/1.6 "Press Start 2P",monospace;text-transform:uppercase}
#inicio p{font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;color:#c9c3d8;max-width:300px;margin:26px 0 0}
#inicio.baixo .botao{width:56px;height:56px;margin:16px 0 12px}#inicio.baixo p{margin-top:10px;font-size:13px}
#inicio h1{max-width:100%}
#aviso{position:absolute;left:12px;right:12px;bottom:12px;font:11px/1.4 monospace;color:#ff9a90;background:rgba(0,0,0,.6);padding:8px;border-radius:8px;display:none;z-index:9;white-space:pre-wrap}
