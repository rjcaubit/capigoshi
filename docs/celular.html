<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Capigoshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
:root {
  --bg:#d9edf8;--bg-deep:#bfe0f3;--ink:#3a2a10;--ink-soft:#7a6448;
  --shell:#a87046;--shell-hi:#c08a5a;--shell-dark:#7a4f2e;
  --sun:#ffc820;--sun-ink:#3a2a10;--grass:#1fb061;--grass-dark:#147842;
  --chip:#fffdf7;--chip-on:#1fb061;--chip-on-ink:#fff;
  --panel-line:rgba(122,79,46,.22);--screen-bezel:#14110e;--focus:#1f6fd0;
  --track:#ead9bd;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1234;--bg-deep:#090c26;--ink:#f3e9d4;--ink-soft:#b7ac96;
  --shell:#8a5a36;--shell-hi:#a8734a;--shell-dark:#5c3a20;
  --chip:#242a5c;--chip-on:#1fb061;--chip-on-ink:#fff;
  --panel-line:rgba(255,214,90,.18);--screen-bezel:#050507;--focus:#ffc820;
  --track:#2a3068; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1234;--bg-deep:#090c26;--ink:#f3e9d4;--ink-soft:#b7ac96;
  --shell:#8a5a36;--shell-hi:#a8734a;--shell-dark:#5c3a20;
  --chip:#242a5c;--chip-on:#1fb061;--chip-on-ink:#fff;
  --panel-line:rgba(255,214,90,.18);--screen-bezel:#050507;--focus:#ffc820;
  --track:#2a3068; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100dvh;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,var(--bg) 0%,var(--bg-deep) 100%) fixed,var(--bg);
  color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-size:15px;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
.pagina{display:flex;flex-direction:column;align-items:stretch;height:100dvh;padding:0;gap:0;}
.shell{
  flex:1;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(165deg,var(--shell-hi) 0%,var(--shell) 45%,var(--shell-dark) 100%);
  border-radius:0;padding:env(safe-area-inset-top,10px) 16px 10px;
  gap:10px;width:100%;
}
.cabeca{display:flex;align-items:center;justify-content:space-between;width:100%;color:rgba(255,240,210,.85);}
.cabeca b{font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:.02em;font-size:1.1rem;}
.btn-engrenagem{
  background:none;border:2px solid rgba(255,240,210,.45);border-radius:50%;
  width:40px;height:40px;min-height:40px;font-size:1.2rem;color:rgba(255,240,210,.9);
  display:flex;align-items:center;justify-content:center;padding:0;
}
.btn-engrenagem:active{background:rgba(0,0,0,.2);}
.tela{
  background:var(--screen-bezel);border-radius:12px;padding:8px;position:relative;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 8px 20px rgba(0,0,0,.6);
  flex:1;display:flex;align-items:center;justify-content:center;width:100%;
}
.tela canvas{display:block;image-rendering:pixelated;height:100%;aspect-ratio:240/284;width:auto;max-width:100%;touch-action:manipulation;border-radius:4px;}
.tela #overlay{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);pointer-events:none;border-radius:4px;}
.botoes-shell{display:flex;gap:20px;flex-shrink:0;}
.btn-fisico{
  width:64px;height:64px;min-height:44px;border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,#ffe27a,var(--sun) 55%,#d9a30e 100%);
  color:var(--sun-ink);font-family:'Fredoka',sans-serif;font-weight:700;font-size:.85rem;line-height:1.1;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.5),0 6px 10px -4px rgba(0,0,0,.6);
  transition:transform .05s;
}
.btn-fisico:active{transform:translateY(3px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);}
.controles{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;flex-shrink:0;
  padding:6px 16px env(safe-area-inset-bottom,8px);
  background:var(--bg-deep);width:100%;
}
.controles span{color:var(--ink-soft);font-size:.9rem;font-weight:600;}
.chip{
  border:1px solid var(--panel-line);background:var(--chip);border-radius:999px;
  min-height:36px;padding:0 14px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:.9rem;
  transition:background .12s,color .12s;
}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--grass-dark);}
.chip:active{transform:translateY(1px);}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="pagina">
  <div class="shell">
    <div class="cabeca">
      <b>capigoshi</b>
      <button class="btn-engrenagem" id="btn-config" type="button" aria-label="Configuração">⚙</button>
    </div>
    <div class="tela" id="tela">
      <canvas id="screen" width="240" height="284" aria-label="Tela do Capigoshi"></canvas>
      <canvas id="overlay" width="960" height="1136" aria-hidden="true"></canvas>
    </div>
    <div class="botoes-shell">
      <button class="btn-fisico" id="btn-sacudir" type="button">Sacudir</button>
      <button class="btn-fisico" id="btn-gritar" type="button">Gritar</button>
    </div>
  </div>
  <div class="controles">
    <span>Velocidade:</span>
    <div id="velocidades" style="display:flex;gap:8px;">
      <button class="chip" type="button" data-v="1">1×</button>
      <button class="chip on" type="button" data-v="10">10×</button>
      <button class="chip" type="button" data-v="60">60×</button>
    </div>
  </div>
</div>
<script>
const W=240,H=284,K=0.078;
const DIA_COMPANION_SEG=600,TICK_PET_SEG=60;
const rgb=(r,g,b)=>`rgb(${r},${g},${b})`;
const MARROM=rgb(168,112,70),ESCURO=rgb(122,79,46),MASCARA=rgb(186,128,89),CREME=rgb(230,192,154);
const ROSA=rgb(224,158,134),BOCHECHA=rgb(206,144,118),ENJOADA=rgb(160,190,120),OLHO=rgb(34,21,11);
const BRANCO=rgb(255,255,255),AMARELO=rgb(255,200,32),VERDE=rgb(31,176,97),VERDE_ESC=rgb(20,120,66);
const BOCA_C=rgb(110,40,30),PRETO=rgb(0,0,0),TEXTO=rgb(58,42,16),AGUA=rgb(90,170,235),VERMELHO=rgb(226,75,74);
const CABECALHO=rgb(255,214,90),BOTAO_BG=rgb(255,248,232);
const _CEU=[[0,[14,18,52]],[5,[28,32,78]],[6.5,[250,165,120]],[8,[130,200,250]],[17,[140,200,245]],[18.5,[250,140,90]],[19.5,[60,50,110]],[21,[14,18,52]],[24,[14,18,52]]];
function corCeu(h){for(let i=0;i<_CEU.length-1;i++){const[h0,c0]=_CEU[i],[h1,c1]=_CEU[i+1];if(h>=h0&&h<=h1){const f=(h-h0)/(h1-h0);return rgb(...c0.map((v,k)=>Math.round(v+(c1[k]-v)*f)));}}return rgb(14,18,52);}
const eNoite=h=>h>=19.5||h<6;
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
ctx.textBaseline='top';
const FONTE='"Press Start 2P",monospace';
function fill(c){ctx.fillStyle=c;ctx.fillRect(0,0,W,H);}
function fillRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function rect(x,y,w,h,c){ctx.strokeStyle=c;ctx.lineWidth=1;ctx.strokeRect(Math.round(x)+.5,Math.round(y)+.5,Math.round(w)-1,Math.round(h)-1);}
function pixel(x,y,c){fillRect(x,y,1,1,c);}
function hline(x,y,w,c){fillRect(x,y,w,1,c);}
function line(x1,y1,x2,y2,c){ctx.strokeStyle=c;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x1+.5,y1+.5);ctx.lineTo(x2+.5,y2+.5);ctx.stroke();}
function ellipse(x,y,rx,ry,c,filled=true,mask=0){
  let a0=0,a1=Math.PI*2;
  if(mask===0b0011){a0=Math.PI;a1=Math.PI*2;}else if(mask===0b1100){a0=0;a1=Math.PI;}
  ctx.beginPath();ctx.ellipse(x,y,Math.max(.5,rx),Math.max(.5,ry),0,a0,a1);
  if(filled){ctx.fillStyle=c;ctx.fill();}else{ctx.strokeStyle=c;ctx.lineWidth=1;ctx.stroke();}
}
function poly(x,y,pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x+pts[0],y+pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(x+pts[i],y+pts[i+1]);ctx.closePath();ctx.fill();}
function texto(s,x,y,c,esc=1){ctx.fillStyle=c;ctx.font=`${8*esc}px ${FONTE}`;ctx.fillText(s,x,y);}
function centro(s,y,c,esc=1){texto(s,(W-s.length*8*esc)/2,y,c,esc);}
function arco(x,y,rx,ry,c,mask,g=2){for(let i=0;i<g;i++)ellipse(x,y,rx-i,ry-i,c,false,mask);}
function coracao(x,y,c=rgb(255,80,120)){ellipse(x-3,y,3,3,c);ellipse(x+3,y,3,3,c);poly(x,y,[-6,1,6,1,0,8],c);}
function balao(s,x,y){const w=s.length*8+10;x=Math.max(2,Math.min(W-w-2,x-w/2));fillRect(x,y,w,14,BRANCO);rect(x,y,w,14,TEXTO);texto(s,x+5,y+3,TEXTO);}
function capi(cx,pe,olhos='normal',boca='sorriso',doente=false,fones=true,pisca=false){
  const X=v=>Math.round(cx+(v-965)*K),Y=v=>Math.round(pe+(v-1810)*K),R=v=>Math.max(1,Math.round(v*K+.5));
  const E=(x,y,rx,ry,c)=>ellipse(X(x),Y(y),R(rx),R(ry),c);
  E(965,1390,495,330,MARROM);E(965,1530,330,240,CREME);
  E(760,1330,100,75,MARROM);E(1170,1330,100,75,MARROM);
  E(750,1760,90,52,ESCURO);E(1180,1760,90,52,ESCURO);
  E(678,560,90,72,ESCURO);E(678,560,45,38,ROSA);E(1253,560,90,72,ESCURO);E(1253,560,45,38,ROSA);
  E(965,835,432,382,MARROM);E(965,940,330,250,MASCARA);E(965,1050,197,145,CREME);
  const bc=doente?ENJOADA:BOCHECHA;E(710,1000,57,32,bc);E(1220,1000,57,32,bc);
  for(const ox of[808,1122]){
    if(olhos==='fechados'||(pisca&&olhos==='normal'))fillRect(X(ox-48),Y(845),R(96),2,OLHO);
    else if(olhos==='feliz')arco(X(ox),Y(880),R(52),R(48),OLHO,0b0011);
    else if(olhos==='susto'){E(ox,845,80,85,BRANCO);E(ox,845,30,32,OLHO);}
    else if(olhos==='sono'){E(ox,845,57,63,OLHO);fillRect(X(ox-60),Y(780),R(120),R(70),MASCARA);}
    else{E(ox,845,57,63,OLHO);E(ox+17,818,17,17,BRANCO);}
  }
  E(965,1003,45,28,OLHO);
  const bx=X(965),by=Y(1092);
  if(boca==='sorriso'){arco(bx,by,R(70),R(48),OLHO,0b1100);fillRect(bx-3,by+R(40),2,3,BRANCO);fillRect(bx+1,by+R(40),2,3,BRANCO);}
  else if(boca==='triste')arco(bx,Y(1150),R(60),R(40),OLHO,0b0011);
  else if(boca==='aberta')E(965,1105,45,55,BOCA_C);
  else if(boca==='meia')E(965,1105,40,18,BOCA_C);
  else if(boca==='o')E(965,1110,32,40,BOCA_C);
  else E(965,1100,16,16,OLHO);
  if(fones){arco(X(965),Y(700),R(355),R(300),OLHO,0b0011,3);for(const x0 of[548,1278]){fillRect(X(x0),Y(610),R(104),R(138),OLHO);fillRect(X(x0+22),Y(632),R(60),R(94),AMARELO);}}
  if(doente)termometro(X(1300),Y(1040));
  return[X(965),Y(835),Y(480)];
}
function termometro(tx,ty){fillRect(tx,ty,3,12,BRANCO);ellipse(tx+1,ty+12,3,3,VERMELHO);fillRect(tx+1,ty+5,1,7,VERMELHO);}
const PATO=rgb(255,200,40),PATO_ESC=rgb(205,145,20),LARANJA=rgb(255,140,30),LARANJA_CL=rgb(255,160,70);
const ROXO=rgb(128,40,128),LILAS=rgb(190,165,230),OLHO_PATO=rgb(60,40,30);
function pato(cx,pe,olhos='normal',boca='sorriso',doente=false,pisca=false){
  ellipse(cx,pe-44,35,46,PATO_ESC);ellipse(cx,pe-44,33,44,PATO);
  ellipse(cx-30,pe-38,8,15,PATO_ESC);ellipse(cx+30,pe-38,8,15,PATO_ESC);
  ellipse(cx-12,pe-2,10,4,LARANJA);ellipse(cx+12,pe-2,10,4,LARANJA);
  ellipse(cx-36,pe-70,9,16,ROXO);ellipse(cx+36,pe-70,9,16,ROXO);
  const bc=doente?ENJOADA:LARANJA_CL;ellipse(cx-23,pe-50,5,3,bc);ellipse(cx+23,pe-50,5,3,bc);
  for(const ox of[cx-13,cx+13]){
    const oy=pe-62;
    if(olhos==='fechados'||(pisca&&olhos==='normal'))fillRect(ox-7,oy,14,2,OLHO_PATO);
    else if(olhos==='feliz')arco(ox,oy+4,7,6,OLHO_PATO,0b0011);
    else if(olhos==='susto'){ellipse(ox,oy,10,10,BRANCO);ellipse(ox,oy,4,4,OLHO_PATO);}
    else if(olhos==='sono'){ellipse(ox,oy,8,8,OLHO_PATO);fillRect(ox-9,oy-9,18,9,PATO);}
    else{ellipse(ox,oy,8,8,OLHO_PATO);ellipse(ox-3,oy-3,2,2,BRANCO);}
  }
  const by=pe-50;
  if(boca==='aberta'){poly(cx,by,[-8,-3,8,-3,0,11],BOCA_C);poly(cx,by,[-8,-3,8,-3,0,3],LARANJA);}
  else if(boca==='meia'){poly(cx,by,[-8,-3,8,-3,0,8],BOCA_C);poly(cx,by,[-8,-3,8,-3,0,4],LARANJA);}
  else if(boca==='o'){poly(cx,by,[-8,-3,8,-3,0,7],LARANJA);ellipse(cx,by+9,3,3,BOCA_C);}
  else if(boca==='triste'){poly(cx,by,[-8,-3,8,-3,0,7],LARANJA);arco(cx,by+14,6,4,OLHO_PATO,0b0011);}
  else if(boca==='dormindo')poly(cx,by,[-6,-2,6,-2,0,5],LARANJA);
  else{poly(cx,by,[-8,-3,8,-3,0,7],LARANJA);arco(cx,by+8,7,4,OLHO_PATO,0b1100);}
  ellipse(cx,pe-82,42,12,ROXO);fillRect(cx-24,pe-91,48,7,LILAS);poly(cx,pe-85,[-24,0,24,0,6,-42],ROXO);
  if(doente)termometro(cx+30,pe-58);
  return[cx,pe-62,pe-128];
}
const CINZA=rgb(205,205,214),CINZA_ESC=rgb(125,125,138),ROSA_EL=rgb(245,165,185);
function elefante(cx,pe,olhos='normal',boca='sorriso',doente=false,pisca=false){
  for(const s of[-1,1]){ellipse(cx+s*32,pe-80,17,19,CINZA_ESC);ellipse(cx+s*32,pe-80,15,17,CINZA);ellipse(cx+s*33,pe-80,9,11,ROSA_EL);}
  ellipse(cx,pe-38,36,44,CINZA_ESC);ellipse(cx,pe-38,34,42,CINZA);
  ellipse(cx-14,pe-2,10,4,CINZA_ESC);ellipse(cx+14,pe-2,10,4,CINZA_ESC);
  ellipse(cx,pe-72,32,30,CINZA_ESC);ellipse(cx,pe-72,30,28,CINZA);
  const bc=doente?ENJOADA:ROSA_EL;ellipse(cx-23,pe-60,5,3,bc);ellipse(cx+23,pe-60,5,3,bc);
  for(const ox of[cx-12,cx+12]){
    const oy=pe-74;
    if(olhos==='fechados'||(pisca&&olhos==='normal'))fillRect(ox-8,oy,16,2,PRETO);
    else if(olhos==='feliz')arco(ox,oy+4,8,7,PRETO,0b0011);
    else if(olhos==='susto'){ellipse(ox,oy,11,11,PRETO);ellipse(ox,oy,10,10,BRANCO);ellipse(ox,oy,3,3,PRETO);}
    else if(olhos==='sono'){ellipse(ox,oy,11,11,PRETO);ellipse(ox,oy,10,10,BRANCO);ellipse(ox+1,oy+1,5,5,PRETO);fillRect(ox-11,oy-11,22,11,CINZA);}
    else{ellipse(ox,oy,11,11,PRETO);ellipse(ox,oy,10,10,BRANCO);ellipse(ox+1,oy+1,5,5,PRETO);ellipse(ox-2,oy-3,2,2,BRANCO);}
  }
  const mx=cx-13,my=pe-52;
  if(boca==='sorriso')arco(mx,my,5,3,PRETO,0b1100);
  else if(boca==='triste')arco(mx,my+3,5,3,PRETO,0b0011);
  else if(boca==='aberta')ellipse(mx,my+1,4,5,BOCA_C);
  else if(boca==='meia')ellipse(mx,my+1,4,2,BOCA_C);
  else if(boca==='o')ellipse(mx,my+1,3,3,BOCA_C);
  const sobe=boca==='aberta'||olhos==='feliz';
  const segs=sobe?[[0,-58,8,9],[1,-48,8,9],[4,-39,7,8],[10,-33,7,6],[17,-38,5,5]]:[[0,-58,8,9],[1,-48,8,9],[3,-38,7,8],[9,-30,7,6],[16,-28,5,4]];
  for(const[dx,dy,rx,ry]of segs)ellipse(cx+dx,pe+dy,rx+1,ry+1,CINZA_ESC);
  for(const[dx,dy,rx,ry]of segs)ellipse(cx+dx,pe+dy,rx,ry,CINZA);
  if(doente)termometro(cx+30,pe-62);
  return[cx,pe-72,pe-102];
}
// Polvo
function polvo(cx,pe,olhos,boca,doente,pisca){
  const C=rgb(150,80,180),esc=rgb(100,40,130);
  for(let i=0;i<4;i++){const tx=cx-18+i*12;ellipse(tx,pe-4,4,8,esc);ellipse(tx,pe+4,3,4,C);}
  ellipse(cx,pe-38,26,28,C);ellipse(cx,pe-60,22,18,C);
  const bc=doente?ENJOADA:rgb(180,130,200);ellipse(cx-16,pe-52,5,3,bc);ellipse(cx+16,pe-52,5,3,bc);
  for(const ox of[cx-10,cx+10]){
    const oy=pe-62;
    if(olhos==='fechados'||(pisca&&olhos==='normal'))fillRect(ox-7,oy,14,2,esc);
    else if(olhos==='feliz')arco(ox,oy+3,6,5,esc,0b0011);
    else if(olhos==='susto'){ellipse(ox,oy,9,9,BRANCO);ellipse(ox,oy,3,3,esc);}
    else if(olhos==='sono'){ellipse(ox,oy,8,8,esc);fillRect(ox-9,oy-9,18,9,C);}
    else{ellipse(ox,oy,8,8,esc);ellipse(ox-2,oy-3,2,2,BRANCO);}
  }
  const my=pe-54;
  if(boca==='sorriso')arco(cx,my,7,5,esc,0b1100);
  else if(boca==='triste')arco(cx,my+3,7,5,esc,0b0011);
  else if(boca==='aberta')ellipse(cx,my+1,5,6,BOCA_C);
  else fillRect(cx-4,my,8,2,esc);
  if(doente)termometro(cx+22,pe-56);
  return[cx,pe-60,pe-82];
}
// Calopsita
function calopsita(cx,pe,olhos,boca,doente,pisca){
  const corp=rgb(160,170,180),cri=rgb(255,220,60),ros=rgb(255,120,80),bec=rgb(180,145,100);
  ellipse(cx-28,pe-40,12,20,corp);ellipse(cx+28,pe-40,12,20,corp);
  ellipse(cx,pe-38,22,30,corp);ellipse(cx,pe-66,20,18,cri);
  for(let i=-1;i<=1;i++)line(cx+i*5,pe-80,cx+i*4,pe-94,cri);
  ellipse(cx-14,pe-62,6,4,ros);ellipse(cx+14,pe-62,6,4,ros);
  for(const ox of[cx-9,cx+9]){
    const oy=pe-68;
    if(olhos==='fechados'||(pisca&&olhos==='normal'))fillRect(ox-6,oy,12,2,PRETO);
    else if(olhos==='feliz')arco(ox,oy+3,5,4,PRETO,0b0011);
    else if(olhos==='susto'){ellipse(ox,oy,8,8,BRANCO);ellipse(ox,oy,3,3,PRETO);}

const MELODIAS={clique:[[1800,25]],feliz:[[784,80],[988,80],[1175,130]],amor:[[659,70],[784,70],[1047,150]],
  comer:[[600,50],[0,30],[600,50],[0,30],[700,70]],banho:[[900,40],[1300,40],[1100,40],[1500,60]],
  remedio:[[523,90],[659,90],[784,160]],susto:[[1400,60],[900,60],[500,140]],bocejo:[[500,140],[400,180]],
  piu:[[2600,40],[0,30],[3000,60]],triste:[[440,120],[370,180]]};
let actx=null;
function tocar(nome){
  if(!cfg.som||!MELODIAS[nome])return;
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    let t=actx.currentTime+0.01;
    for(const[f,ms]of MELODIAS[nome]){
      const d=ms/1000;
      if(f>0){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.004);
        g.gain.setValueAtTime(0.16,Math.max(t+0.004,t+d-0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
        o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+0.01);}
      t+=d;
    }
  }catch(e){}
}
const cfg={modo:'companion',som:true,personagem:'capi'};

const S={

  proximaVisita:20000,capiModo:'anda',proximoModoT:0,capiYAgua:0,capiYDir:1,

const ROTINA=[[0,'dormindo'],[6.5,'espreguicando'],[7,'comendo'],[9,'passeando'],[12,'comendo'],[13,'banho'],[15.5,'passeando'],[18,'por do sol'],[19.5,'passeando'],[21.5,'dormindo']];
const TEXTOS={dormindo:'Capi esta dormindo',espreguicando:'Capi acordou',comendo:'Capi comendo capim',passeando:'Capi passeando',banho:'Capi no banho de lago','por do sol':'Olhando o por do sol'};
const AMIGOS_DIA=['passarinho','tartaruga','borboleta','sapo'];
const FALAS={passarinho:'Piu pra voce!',tartaruga:'Oi, Tata!',borboleta:'Que linda!',sapo:'Oi, Sapinho!'};
const rnd=(a,b)=>a+Math.random()*(b-a);
const horaReal=()=>(S.relogioMin/60)%24;
const horaVirtual=()=>(S.minutoVirtual/60)%24;
function atividadeCompanion(){const h=horaVirtual();let a=ROTINA[0][1];for(const[i,n]of ROTINA)if(h>=i)a=n;return a;}
function dormindo(){return cfg.modo==='companion'?atividadeCompanion()==='dormindo':pet.dormindo;}
function iniciarAnim(n){S.anim=n;S.animIni=S.t;}

function falar(s,ms=2500){S.fala=s;S.falaAte=S.t+ms;}
const noitePet=()=>{const h=horaReal();return h>=21||h<7;};
function tickPet(){
  const noite=noitePet();
  if(pet.dormindo){
    pet.fome-=0.6;pet.energia+=4;
    const acordar=(!noite&&!pet.cochilo)||(pet.cochilo&&pet.energia>=60);
    if(acordar){pet.dormindo=pet.cochilo=false;mostrarMsg('Bom dia!');tocar('feliz');}
  }else{
    pet.fome-=1.6;pet.alegria-=1.2;pet.energia-=0.8;
    if(pet.cocos<3&&Math.random()<0.06)pet.cocos++;
    if(noite||pet.energia<8){pet.dormindo=true;pet.cochilo=!noite;mostrarMsg(noite?'Boa noite!':'Cochilo...');tocar('bocejo');}
  }
  if(!pet.doente&&(pet.cocos>=2||pet.fome<15)&&Math.random()<0.08){pet.doente=true;mostrarMsg('To dodoi...');tocar('triste');}
  const perda=pet.cocos*0.8+(pet.fome<15?2:0)+(pet.doente?2.5:0);
  pet.saude+=perda?-perda:0.5;
  for(const k of['fome','alegria','energia','saude'])pet[k]=lim(pet[k]);
  salvar();
}
function acaoPet(i){
  if(pet.dormindo){mostrarMsg('Shhh... zzz');return;}
  tocar('clique');
  if(i===0){if(pet.fome>92)mostrarMsg('To cheia!');else{pet.fome=lim(pet.fome+25);iniciarAnim('comer');tocar('comer');}}
  else if(i===1){if(pet.energia<15)mostrarMsg('Cansada...');else{pet.alegria=lim(pet.alegria+20);pet.energia=lim(pet.energia-8);iniciarAnim('pular');tocar('feliz');}}
  else if(i===2){pet.cocos=0;pet.saude=lim(pet.saude+3);iniciarAnim('banho');mostrarMsg('Que banho bom!');tocar('banho');}
  else if(i===3){if(pet.doente){pet.doente=false;pet.saude=lim(pet.saude+35);iniciarAnim('remedio');mostrarMsg('Melhorei!');tocar('remedio');}else mostrarMsg('Nao to doente!');}
  salvar();
}
function atualizarCompanion(dt,agora){
  const antes=horaVirtual();
  S.minutoVirtual+=dt*1440/(DIA_COMPANION_SEG*1000)*S.speed;
  if(horaVirtual()<antes)S.diaVirtual++;
  const ativ=atividadeCompanion();
  const naAgua=ativ==='banho'&&Math.abs(S.capiX-200)<32;
  if(ativ==='banho'){if(!naAgua){S.alvoX=200;if(S.capiModo==='para')S.capiModo='anda';}}
  else if(ativ==='comendo'){S.alvoX=60;if(S.capiModo==='para'&&Math.abs(S.capiX-60)>8)S.capiModo='anda';}
  else if(['dormindo','por do sol','espreguicando'].includes(ativ)){S.alvoX=110;if(S.capiModo==='para'&&Math.abs(S.capiX-110)>8)S.capiModo='anda';}
  else if(ativ==='passeando'){
    const chegou=Math.abs(S.capiX-S.alvoX)<3,mudou=agora>S.proximoModoT;
    if(chegou||mudou){
      const r=Math.random();
      if(r<0.22){S.capiModo='para';S.proximoModoT=agora+rnd(900,2800);}
      else if(r<0.48){S.capiModo='corre';S.alvoX=rnd(42,198);S.proximoModoT=agora+rnd(600,1800);}
      else{S.capiModo='anda';S.alvoX=rnd(42,198);S.proximoModoT=agora+rnd(2000,5500);}
    }
  }
  let passo;
  if(naAgua){
    S.capiYAgua+=dt*0.007*S.capiYDir;
    if(Math.abs(S.capiYAgua)>7)S.capiYDir*=-1;
    if(Math.abs(S.capiX-S.alvoX)<3&&agora>S.proximoModoT){S.alvoX=rnd(176,200);S.proximoModoT=agora+rnd(1800,4200);}
    passo=dt*0.014;
  }else if(S.capiModo==='corre')passo=dt*0.060;
  else if(S.capiModo==='para')passo=0;
  else passo=dt*0.028;
  if(Math.abs(S.alvoX-S.capiX)>passo)S.capiX+=S.alvoX>S.capiX?passo:-passo;
  if(!S.visita&&agora>S.proximaVisita)chamarVisita(eNoite(horaVirtual())?'vagalumes':AMIGOS_DIA[Math.floor(Math.random()*4)]);
  if(S.visita){
    const dur=agora-S.visitaIni;
    if(S.visita==='tartaruga')S.visitaX-=dt*0.02;
    const pronta={tartaruga:Math.abs(S.visitaX-S.capiX)<35,borboleta:dur>1500,sapo:dur>800,passarinho:dur>3000}[S.visita]||false;
    if(pronta&&!S.visitaFalou&&!dormindo()){S.visitaFalou=true;falar(FALAS[S.visita]);tocar(S.visita==='passarinho'?'piu':'feliz');}
    if(dur>14000||S.visitaX<-30){S.visita='';S.proximaVisita=agora+rnd(25000,60000);}
  }
}
function chamarVisita(nome){S.visita=nome;S.visitaIni=S.t;S.visitaFalou=false;S.visitaX=nome==='tartaruga'?250:-10;}
function desenharVisita(agora,topo){
  const dur=agora-S.visitaIni,cabX=Math.round(S.capiX);
  if(S.visita==='passarinho'){
    let x,y;
    if(dur<3000){const f=dur/3000;x=-10+(cabX+10)*f;y=70+(topo-76)*f+Math.sin(dur/150)*5;}
    else if(dur<10000){x=cabX;y=topo-6;}
    else{const f=(dur-10000)/4000;x=cabX+150*f;y=topo-6-90*f;}
    passarinho(Math.round(x),Math.round(y),agora);
  }else if(S.visita==='tartaruga')tartaruga(Math.round(S.visitaX),208,agora);
  else if(S.visita==='borboleta')borboleta(Math.round(S.capiX+45*Math.sin(dur/900)),Math.round(topo+5+15*Math.sin(dur/450)),agora);
  else if(S.visita==='sapo')sapo(196,208,agora);
  else if(S.visita==='vagalumes')for(let i=0;i<6;i++)vagalume(Math.round(30+i*35+10*Math.sin(dur/700+i)),Math.round(120+30*Math.sin(dur/900+i*2)),agora,i);
}
function sensor(sacudiu){
  const agora=S.t;
  if(agora-S.ultimaReacao<3000)return;
  S.ultimaReacao=agora;
  if(dormindo()){iniciarAnim('susto');mostrarMsg('Que susto!');tocar('susto');pet.alegria=lim(pet.alegria-5);}
  else{iniciarAnim('festa');mostrarMsg(sacudiu?'Uhuuu! Adorei!':'Que voz linda!');tocar('feliz');pet.alegria=lim(pet.alegria+10);}
}
function barra(x,y,rot,v,c){texto(rot,x,y,TEXTO);fillRect(x,y+10,96,7,rgb(255,243,196));if(v>2)fillRect(x,y+10,Math.floor(v*0.96),7,v<25?VERMELHO:c);}
const BOTOES=['Comer','Brincar','Banho','Remedio'];
function desenharBotoes(){
  BOTOES.forEach((rot,i)=>{
    const bx=6+i*57,by=226;
    fillRect(bx,by,55,46,BOTAO_BG);rect(bx,by,55,46,ESCURO);
    const cx=bx+27,cy=by+17;
    if(i===0)capim(cx,cy+8);
    else if(i===1){ellipse(cx,cy,8,8,rgb(255,154,31));ellipse(cx+3,cy-9,3,2,VERDE);}
    else if(i===2){ellipse(cx,cy+3,6,6,AGUA);poly(cx,cy,[-6,2,6,2,0,-10],AGUA);}
    else pilula(cx,cy);
    texto(rot,cx-rot.length*4,by+34,TEXTO);
  });
}
let ultimo={pe:205,olhos:'normal',boca:'sorriso',ativ:'',naAgua:false,correndo:false};
function desenharJogo(agora){
  const modo=cfg.modo;
  const hora=modo==='companion'?horaVirtual():horaReal();
  const chao=modo==='companion'?H:230;
  cenario(hora,chao,agora);
  const da=agora-S.animIni;
  if(S.anim&&da>2200)S.anim='';
  if(S.fala&&agora>=S.falaAte)S.fala='';
  const dorme=dormindo();
  fillRect(0,0,W,46,CABECALHO);
  if(modo==='pet'){
    barra(16,3,'Fome',pet.fome,rgb(255,138,42));barra(112,3,'Alegria',pet.alegria,rgb(226,80,138));
    barra(16,24,'Energia',pet.energia,rgb(58,138,232));barra(112,24,'Saude',pet.saude,VERDE);
  }else{
    const h=horaVirtual();
    texto(`${String(Math.floor(h)).padStart(2,'0')}:${String(Math.floor(h*60)%60).padStart(2,'0')}`,14,10,TEXTO,2);
    texto(`Dia ${S.diaVirtual}`,100,8,TEXTO);texto('Companion',100,24,ESCURO);
  }
  engrenagem(222,25,ESCURO);
  const cx=modo==='companion'?Math.round(S.capiX):110;
  const ativ=modo==='companion'?atividadeCompanion():'';
  const naAgua=modo==='companion'&&ativ==='banho'&&Math.abs(S.capiX-200)<32;
  const correndo=modo==='companion'&&S.capiModo==='corre'&&Math.abs(S.alvoX-S.capiX)>2;
  let pe=205;
  if(dorme)pe+=Math.trunc(Math.sin(agora/900));
  else if(naAgua)pe=211+Math.trunc(S.capiYAgua);
  else pe+=Math.trunc(Math.sin(agora/300)*1.5);
  if(S.anim==='pular'||S.anim==='festa')pe-=Math.trunc(Math.abs(Math.sin(da/120))*22);
  else if(correndo)pe-=Math.trunc(Math.abs(Math.sin(agora/72))*6);
  if(S.anim==='susto')pe-=Math.trunc(Math.max(0,18-da/25));
  const andando=modo==='companion'&&Math.abs(S.alvoX-S.capiX)>1&&!correndo;
  if(andando)pe-=Math.trunc(Math.abs(Math.sin(agora/110))*3);
  let olhos='normal',boca='sorriso';
  const doente=pet.doente&&modo==='pet';
  const triste=modo==='pet'&&(pet.alegria<30||pet.fome<25);
  if(S.anim==='susto'){olhos='susto';boca='o';}
  else if(dorme){olhos='fechados';boca='dormindo';}
  else if(naAgua||correndo){olhos='feliz';boca='sorriso';}
  else if(modo==='companion'&&S.capiModo==='para'&&!S.anim){olhos='normal';boca='o';}
  else if(['festa','pular','carinho','remedio'].includes(S.anim)||ativ==='por do sol'){olhos='feliz';boca='sorriso';}
  else if(S.anim==='comer'||(ativ==='comendo'&&!andando))boca=(Math.floor(agora/220)%2)?'aberta':'meia';
  else if(ativ==='espreguicando'){olhos='sono';boca='o';}
  else if(doente){olhos='sono';boca='triste';}
  else if(triste)boca='triste';
  const[,cabY,topo]=PERSONAGENS[cfg.personagem].desenhar(cx,pe,olhos,boca,doente,(agora%3800)<150);
  if(correndo&&!dorme)rastro(cx,S.alvoX>S.capiX?1:-1,agora);
  if(naAgua){ellipse(cx,212,38,9,AGUA);ondasNado(cx,agora);}
  else if(S.anim==='banho'){ellipse(cx,207,40,7,AGUA);bolhas(cx,cabY+10,agora);}
  for(let i=0;i<(modo==='pet'?pet.cocos:0);i++){const x=20+i*16;ellipse(x,211,5,4,rgb(90,58,26));ellipse(x,206,3,3,rgb(90,58,26));}
  if(S.anim==='comer')for(let i=0;i<3-Math.min(3,Math.floor(da/500));i++)capim(cx+24+i*6,cabY+22);
  if(S.anim==='carinho'||S.anim==='festa')for(let i=0;i<3;i++)coracao(cx-28+i*28,topo-4-Math.floor(da/30)%30);
  if(S.anim==='remedio'&&da<800)pilula(cx+20,cabY+15-Math.floor(da/60));
  if(S.anim==='susto')texto('!',cx+30,topo-6,VERMELHO,2);
  if(dorme&&S.anim!=='susto'){const z=Math.floor(agora/450)%3;texto('z',cx+32+z*4,topo-z*7,BRANCO,2);}
  if(modo==='companion'&&S.visita)desenharVisita(agora,topo);
  if(S.fala)balao(S.fala,cx,topo-22);
  if(S.msg&&agora<S.msgAte){const w=S.msg.length*16+12;fillRect((W-w)/2,52,w,22,BRANCO);centro(S.msg,55,TEXTO,2);}
  if(modo==='pet')desenharBotoes();
  else{fillRect(0,252,W,32,rgb(20,120,66));centro((TEXTOS[ativ]||'').replace('Capi',PERSONAGENS[cfg.personagem].nome),264,BRANCO);}
  ultimo={pe,olhos,boca,ativ,naAgua,correndo};
}
function botao(x,y,w,h,rot,ativo=false){fillRect(x,y,w,h,ativo?VERDE:BOTAO_BG);rect(x,y,w,h,ESCURO);texto(rot,x+Math.floor((w-rot.length*8)/2),y+Math.floor((h-8)/2),ativo?BRANCO:TEXTO);}
function desenharConfig(){
  fill(CABECALHO);centro('Configuracao',10,TEXTO,2);
  texto('Modo',12,38,TEXTO);botao(12,48,104,28,'Pet',cfg.modo==='pet');botao(124,48,104,28,'Companion',cfg.modo==='companion');
  texto('Som',12,82,TEXTO);botao(12,92,104,28,'Ligado',cfg.som);botao(124,92,104,28,'Desligado',!cfg.som);
  texto('Personagem',12,126,TEXTO);
  for(let i=0;i<9;i++){
    const col=i%3,row=Math.floor(i/3);
    botao(12+col*74,136+row*32,68,28,NOMES_CURTOS[i],cfg.personagem===LISTA_PERS[i]);
  }
  botao(60,238,120,36,'Voltar',true);
}
function toqueConfig(x,y){
  if(y>=48&&y<=76)cfg.modo=x<120?'pet':'companion';
  else if(y>=92&&y<=120)cfg.som=x<120;
  else if(y>=136&&y<=228){
    const row=Math.min(2,Math.floor((y-136)/32));
    const col=x<82?0:(x<156?1:2);
    const idx=row*3+col;
    if(idx>=0&&idx<9)cfg.personagem=LISTA_PERS[idx];
  }
  else if(y>=238&&y<=274&&x>=60&&x<=180){S.tela='jogo';salvar();return;}
  tocar('clique');salvar();
}
function processarToque(x,y){
  if(S.tela==='config'){toqueConfig(x,y);return;}
  if(x>200&&y<44){S.tela='config';tocar('clique');return;}
  if(cfg.modo==='pet'&&y>=226){acaoPet(Math.min(3,Math.floor(Math.max(0,x-6)/57)));return;}
  const cx=cfg.modo==='companion'?Math.round(S.capiX):110;
  if(Math.abs(x-cx)<45&&y>110&&y<212&&!dormindo()){pet.alegria=lim(pet.alegria+3);iniciarAnim('carinho');tocar('amor');}
}
const SAVE_KEY='capi-celular-v1';
function salvar(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      pet:{fome:pet.fome,alegria:pet.alegria,energia:pet.energia,saude:pet.saude,cocos:pet.cocos,doente:pet.doente,dormindo:pet.dormindo,cochilo:pet.cochilo},
      modo:cfg.modo,personagem:cfg.personagem,som:cfg.som,
      speed:S.speed,relogioMin:S.relogioMin,minutoVirtual:S.minutoVirtual,diaVirtual:S.diaVirtual,
    }));
  }catch(e){}
}
function carregar(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
    if(d.pet){Object.assign(pet,{
      fome:+d.pet.fome||80,alegria:+d.pet.alegria||80,energia:+d.pet.energia||80,
      saude:+d.pet.saude||100,cocos:+d.pet.cocos||0,
      doente:!!d.pet.doente,dormindo:!!d.pet.dormindo,cochilo:!!d.pet.cochilo,
    });}
    if(d.modo)cfg.modo=d.modo;
    if(d.personagem&&PERSONAGENS[d.personagem])cfg.personagem=d.personagem;
    if(typeof d.som==='boolean')cfg.som=d.som;
    if(d.speed)S.speed=+d.speed;
    if(typeof d.relogioMin==='number')S.relogioMin=d.relogioMin;
    if(typeof d.minutoVirtual==='number')S.minutoVirtual=d.minutoVirtual;
    if(d.diaVirtual)S.diaVirtual=+d.diaVirtual;
  }catch(e){}
}
let anterior=null,ultimoSalve=0;
function laco(ts){
  if(anterior===null)anterior=ts;
  const dt=Math.min(ts-anterior,80);anterior=ts;S.t=ts;
  if(S.tela==='config'){desenharConfig();}
  else{
    if(S.speed>0){
      if(cfg.modo==='pet'){
        S.relogioMin=(S.relogioMin+dt*S.speed/60000)%1440;
        S.tickAcc+=dt*S.speed;
        while(S.tickAcc>=TICK_PET_SEG*1000){S.tickAcc-=TICK_PET_SEG*1000;tickPet();}
      }else atualizarCompanion(dt,ts);
    }
    desenharJogo(ts);
  }
  if(ts-ultimoSalve>30000){salvar();ultimoSalve=ts;}
  requestAnimationFrame(laco);
}
function coordDoEvento(e){const r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*W/r.width),y:Math.floor((e.clientY-r.top)*H/r.height)};}
canvas.addEventListener('pointerdown',e=>{const p=coordDoEvento(e);processarToque(p.x,p.y);});
document.getElementById('btn-sacudir').addEventListener('click',()=>{if(S.tela==='jogo')sensor(true);});
document.getElementById('btn-gritar').addEventListener('click',()=>{if(S.tela==='jogo')sensor(false);});
document.getElementById('btn-config').addEventListener('click',()=>{S.tela=S.tela==='config'?'jogo':'config';tocar('clique');});
document.getElementById('velocidades').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  S.speed=+b.dataset.v;
  document.querySelectorAll('#velocidades .chip').forEach(btn=>btn.classList.toggle('on',+btn.dataset.v===S.speed));
  salvar();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)salvar();});
window.addEventListener('pagehide',salvar);
function iniciar(){
  carregar();
  document.querySelectorAll('#velocidades .chip').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.speed));
  const comecar=()=>requestAnimationFrame(laco);
  if(document.fonts&&document.fonts.load)Promise.race([document.fonts.load(`8px ${FONTE}`),new Promise(r=>setTimeout(r,1500))]).then(comecar,comecar);
  else comecar();
}
iniciar();
</script>
